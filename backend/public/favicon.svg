<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="bg" cx="50%" cy="30%">
      <stop offset="0%" stop-color="#4fc3f7" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#25d366" stop-opacity="1"/>
      <stop offset="100%" stop-color="#128c7e" stop-opacity="1"/>
    </radialGradient>
  </defs>
  
  <!-- Glow effect -->
  <circle cx="16" cy="16" r="15" fill="#25d366" opacity="0.4" filter="url(#glow)"/>
  
  <!-- Main background -->
  <circle cx="16" cy="16" r="13" fill="url(#bg)" stroke="#00ff88" stroke-width="0.5" opacity="0.95"/>
  
  <!-- WhatsApp W letter logo -->
  <g transform="translate(16,16)">
    <!-- W shape -->
    <path d="M-10 -8 L-6 8 L-2 -2 L2 8 L6 -8 L10 8" 
          stroke="white" 
          stroke-width="2.5" 
          fill="none" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          opacity="0.9"/>
    
    <!-- Chat bubble tail -->
    <path d="M8 6 L12 10 L8 8 Z" fill="white" opacity="0.7"/>
    
    <!-- Signal dots -->
    <circle cx="8" cy="-8" r="1" fill="#4fc3f7" opacity="0.8" filter="url(#glow)"/>
    <circle cx="10" cy="-6" r="0.8" fill="#4fc3f7" opacity="0.6" filter="url(#glow)"/>
    <circle cx="12" cy="-4" r="0.6" fill="#4fc3f7" opacity="0.4" filter="url(#glow)"/>
  </g>
</svg>
