<!-- Centralized Media Library Modal Template -->
<div ng-if="show" class="fixed" style="top: 0 !important; left: 0 !important; width: 100vw !important; height: 100vh !important; background: rgba(0, 0, 0, 0.5) !important; display: flex !important; align-items: center !important; justify-content: center !important; z-index: 99999 !important;" ng-click="closeModal()">
  <div class="bg-slate-800 rounded-xl shadow-2xl border-2 border-slate-600" 
       style="background: linear-gradient(115deg, #0c1624 0%, #051733 30%, #091426 70%, #0f172a 100%), radial-gradient(circle at 60% 40%, #3b82f6 0%, transparent 80%) !important; 
              width: 98% !important; 
              max-width: 1000px !important; 
              max-height: 85vh !important; 
              overflow: hidden !important; 
              margin: 1rem !important;" 
       ng-click="$event.stopPropagation()">
    
    <!-- Header -->
    <div class="p-4 border-b border-slate-600 flex justify-between items-center">
      <h2 class="text-xl font-semibold text-white">Select Media from Library</h2>
      <button type="button" ng-click="closeModal()" class="text-gray-400 hover:text-white transition-colors">
        <i class="fas fa-times text-xl"></i>
      </button>
    </div>

    <!-- Content -->
    <div class="p-4" style="max-height: calc(85vh - 120px); overflow-y: auto;">
      <!-- Loading State -->
      <div ng-if="loadingMedia" class="flex items-center justify-center py-12">
        <div class="flex flex-col items-center">
          <svg class="animate-spin h-8 w-8 text-cyan-400 mb-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <p class="text-gray-300">Loading media library...</p>
        </div>
      </div>

      <!-- Empty State -->
      <div ng-if="!loadingMedia && mediaLibrary.length === 0" class="text-center py-12">
        <div class="w-16 h-16 bg-gradient-to-r from-gray-600 to-gray-700 rounded-full flex items-center justify-center mx-auto mb-4">
          <i class="fas fa-folder-open text-gray-300 text-2xl"></i>
        </div>
        <p class="text-gray-300 text-lg font-medium">No media files found in your library</p>
        <p class="text-gray-400 text-sm mt-2">Upload media files to the library first</p>
      </div>

      <!-- Media Grid - Responsive -->
      <div ng-if="!loadingMedia && mediaLibrary.length > 0" class="grid gap-2" 
           style="grid-template-columns: repeat(auto-fit, minmax(50px, 1fr)) !important; min-width: 100%; width: 100%;">
        <div ng-repeat="media in mediaLibrary" 
             class="cursor-pointer transition-all duration-200 hover:opacity-80 hover:scale-105" 
             ng-click="selectMedia(media)" 
             style="aspect-ratio: 1; position: relative; width: 50px; height: 50px; min-width: 50px; max-width: 70px;">
          
          <!-- Image Preview -->
          <div ng-if="media.type === 'image'" 
               class="w-full h-full rounded border border-slate-600 hover:border-cyan-400 transition-colors">
            <img ng-src="{{media._trustedUrl}}" 
                 class="w-full h-full object-cover" 
                 alt="{{media.name}}"
                 onerror="this.onerror=null; this.src='/images/image-placeholder.png';">
          </div>
          
          <!-- Video Preview -->
          <div ng-if="media.type === 'video'" 
               class="w-full h-full rounded border border-slate-600 hover:border-cyan-400 transition-colors relative">
            <video ng-src="{{media._trustedUrl}}" 
                   class="w-full h-full object-cover" 
                   poster="/images/video-placeholder.png"
                   preload="metadata">
            </video>
            <div class="absolute inset-0 flex items-center justify-center bg-black/30">
              <i class="fas fa-play-circle text-white text-sm"></i>
            </div>
          </div>
          
          <!-- Document Preview -->
          <div ng-if="media.type === 'document'" 
               class="w-full h-full rounded border border-slate-600 hover:border-cyan-400 transition-colors bg-slate-700 flex flex-col items-center justify-center">
            <i class="fas fa-file-alt text-gray-400 text-sm"></i>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="p-4 border-t border-slate-600 flex justify-end">
      <button type="button" ng-click="closeModal()" 
              class="px-4 py-2 bg-gray-500 hover:bg-gray-600 text-white rounded-lg transition-colors">
        Cancel
      </button>
    </div>
  </div>
</div>

<!-- Mobile-specific styles -->
<style>
  @media (max-width: 768px) {
    .fixed[ng-if="show"] > div {
      width: 95% !important;
      max-width: none !important;
      margin: 1rem !important;
      max-height: 90vh !important;
    }
    
    .fixed[ng-if="show"] .grid {
      grid-template-columns: repeat(auto-fit, minmax(40px, 1fr)) !important;
      gap: 0.25rem !important;
    }
  }
  
  @media (max-width: 480px) {
    .fixed[ng-if="show"] > div {
      width: 98% !important;
      margin: 0.5rem !important;
      max-height: 95vh !important;
    }
    
    .fixed[ng-if="show"] .grid {
      grid-template-columns: repeat(auto-fit, minmax(35px, 1fr)) !important;
      gap: 0.25rem !important;
    }
  }
</style>
