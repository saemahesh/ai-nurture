<!DOCTYPE html>
<html>
<head>
  <title>WhatsPro - Groups</title>
  <link rel="stylesheet" href="dark-theme.css">
  <style>
    .white-border-btn { border: 2px solid #fff !important; }
  </style>
</head>
<body>
<div class="flex h-screen dark-theme">
  <!-- Sidebar -->
  <div ng-include="'sidebar.html?v=' + Date.now()" ng-controller="SidebarController"></div>

  <!-- Main Content Area -->
  <div class="flex-1 flex flex-col overflow-hidden">
    <!-- Top Header -->
    <header class="dark-theme-header dark-theme-header-bg z-10 py-4 px-6">
      <div class="flex justify-between items-center">
        <h2 class="text-xl font-semibold text-white" style="padding-left:50px;">Manage Groups</h2>
        <div class="flex items-center">
          <button ng-click="showCreateGroupModal()" class="ml-4 p-2 rounded-full dark-theme-button-primary shadow transition white-border-btn" title="Create Group">
            <i class="fas fa-plus"></i>
            <span class="ml-2 hidden sm:inline">Add Group</span>
          </button>
          <button ng-click="syncGroups()" class="ml-2 p-2 rounded-full dark-theme-button-secondary shadow transition white-border-btn" title="Sync Groups">
            <i class="fas fa-sync"></i>
            <span class="ml-2 hidden sm:inline">Sync Groups</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto p-2" style="background: linear-gradient(115deg, #0c1624 0%, #051733 30%, #091426 70%, #0f172a 100%), radial-gradient(circle at 60% 40%, #3b82f6 0%, transparent 80%) !important;">

      <!-- Groups List -->
      <div class="bg-gradient-to-br from-gray-800 to-gray-900 rounded-xl shadow-lg p-6 max-w-4xl mx-auto border border-gray-700">
        <div class="mb-6">
          <h3 class="text-xl font-semibold text-white mb-2">WhatsApp Groups</h3>
          <p class="text-gray-400">Manage your WhatsApp groups for automated messaging</p>
        </div>
        <div ng-if="groups.length === 0" class="text-center text-gray-400 py-12">
          <div class="mb-4">
            <i class="fas fa-users text-4xl text-gray-500"></i>
          </div>
          <h4 class="text-lg font-medium text-gray-300 mb-2">No groups added yet</h4>
          <p class="text-gray-500 mb-4">Start by adding your first WhatsApp group</p>
          <button ng-click="showCreateGroupModal()" class="bg-gradient-to-r from-teal-600 to-teal-700 text-white px-4 py-2 rounded-lg hover:from-teal-500 hover:to-teal-600 transition white-border-btn">
            <i class="fas fa-plus mr-2"></i>Add First Group
          </button>
        </div>
        <div class="space-y-3" ng-if="groups.length > 0">
          <div ng-repeat="g in groups" 
               class="flex items-center justify-between p-4 bg-gradient-to-r from-gray-700 to-gray-800 rounded-lg border border-gray-600 hover:from-gray-650 hover:to-gray-750 transition-all">
            <div class="flex items-center">
              <div class="w-10 h-10 bg-gradient-to-br from-teal-600 to-teal-700 rounded-full flex items-center justify-center mr-4">
                <i class="fas fa-users text-teal-200"></i>
              </div>
              <div>
                <span class="font-medium text-white">{{g.name}}</span>
              </div>
            </div>
            <button ng-click="deleteGroup(g.id)" 
                    class="px-3 py-1 text-sm text-red-400 hover:bg-red-900/30 rounded-lg transition-colors white-border-btn">
              <i class="fas fa-trash mr-1"></i>Delete
            </button>
          </div>
        </div>
      </div>
    </main>

    <!-- Create Group Modal (positioned to avoid layout issues but within controller scope) -->
    <div ng-if="createGroupModalVisible" 
         class="fixed" 
         ng-click="hideCreateGroupModal(); $event.preventDefault();" 
         style="top: 0 !important; left: 0 !important; width: 100vw !important; height: 100vh !important; z-index: 99999 !important; display: block !important; cursor: pointer !important; background-color: rgba(0, 0, 0, 0.3) !important;">
      <div class="bg-gradient-to-br from-gray-800 to-gray-900 rounded-xl shadow-xl border border-gray-700" 
           ng-click="$event.stopPropagation();" 
           style="position: fixed !important; 
                  top: 50vh !important; 
                  left: 50vw !important; 
                  transform: translate(-50%, -50%) !important; 
                  width: 90% !important; 
                  max-width: 500px !important; 
                  max-height: 90vh !important; 
                  overflow-y: auto !important; 
                  padding: 24px !important; 
                  z-index: 100000 !important; 
                  cursor: default !important;
                  background: linear-gradient(115deg, #0c1624 0%, #051733 30%, #091426 70%, #0f172a 100%), radial-gradient(circle at 60% 40%, #3b82f6 0%, transparent 80%) !important;">
        <div class="flex justify-between items-center mb-6">
          <h3 class="text-xl font-semibold text-white">Create New Group</h3>
          <button class="text-gray-400 hover:text-gray-300 close-x-button" style="border: none !important; outline: none !important; background: transparent !important;" ng-click="hideCreateGroupModal()">
            <i class="fas fa-times"></i>
          </button>
        </div>
        <form ng-submit="addGroup(); hideCreateGroupModal();" class="space-y-4">
          <div class="space-y-2">
            <label class="block text-sm font-medium text-teal-300">Group Name</label>
            <input type="text" ng-model="newGroup.name" class="dark-theme-input w-full px-4 py-2 rounded-lg" placeholder="Enter group name" required>
          </div>
          <div class="space-y-2">
            <label class="block text-sm font-medium text-teal-300">Group ID</label>
            <input type="text" ng-model="newGroup.groupId" class="dark-theme-input w-full px-4 py-2 rounded-lg" placeholder="Enter group ID for automation" required>
          </div>
          <div class="flex items-center justify-between pt-4">
            <button type="submit" class="px-6 py-2 bg-gradient-to-r from-teal-600 to-teal-700 text-white rounded-lg hover:from-teal-500 hover:to-teal-600 transition white-border-btn">
              <i class="fas fa-plus mr-2"></i>Create Group
            </button>
            <span class="text-red-400" ng-if="groupError">{{groupError}}</span>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div ng-if="toast.show" class="fixed top-4 right-4 z-50 transition-all duration-300 ease-in-out">
      <div class="rounded-lg shadow-lg px-6 py-4 max-w-sm" 
           ng-class="{
               'bg-green-600 text-white': toast.type === 'success',
               'bg-red-600 text-white': toast.type === 'error',
               'bg-yellow-600 text-white': toast.type === 'warning',
               'bg-blue-600 text-white': toast.type === 'info'
           }">
          <div class="flex items-center">
              <i class="fas mr-3" 
                 ng-class="{
                     'fa-check-circle': toast.type === 'success',
                     'fa-exclamation-circle': toast.type === 'error',
                     'fa-exclamation-triangle': toast.type === 'warning',
                     'fa-info-circle': toast.type === 'info'
                 }"></i>
              <span>{{toast.message}}</span>
          </div>
      </div>
  </div>

  <!-- Confirmation Modal -->
  <div ng-if="showConfirmModal" class="fixed inset-0 z-50 flex items-center justify-center min-h-screen overflow-y-auto" style="background: rgba(15,23,42,0.7); z-index: 99999 !important;" ng-click="handleCancel()">
    <div class="bg-gradient-to-br from-slate-700 via-gray-800 to-slate-900 rounded-xl shadow-2xl p-4 sm:p-6 w-full max-w-lg mx-auto border-2 border-slate-600 relative" style="background: linear-gradient(115deg, #0c1624 0%, #051733 30%, #091426 70%, #0f172a 100%), radial-gradient(circle at 60% 40%, #3b82f6 0%, transparent 80%) !important; min-height: 0; margin-top: 4rem; margin-bottom: 2rem;" ng-click="$event.stopPropagation()">
      <!-- Close X button at top -->
      <button type="button" class="absolute top-3 right-3 text-gray-400 hover:text-white text-xl font-bold close-x-button" style="border: none !important; outline: none !important; background: transparent !important;" ng-click="handleCancel()">✕</button>
      
      <div class="pt-4">
        <div class="flex items-center mb-4">
          <div class="flex-shrink-0 mr-3">
            <svg class="w-8 h-8 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L3.732 16.5c-.77.833.192 2.5 1.732 2.5z"></path>
            </svg>
          </div>
          <div>
            <h3 class="text-lg font-semibold text-white">{{confirmModal.title}}</h3>
          </div>
        </div>
        
        <div class="mb-6">
          <p class="text-gray-300">{{confirmModal.message}}</p>
          <p class="text-sm text-gray-400 mt-2">This action cannot be undone.</p>
        </div>
        
        <div class="flex justify-end space-x-3">
          <button 
            ng-click="handleCancel()"
            class="px-4 py-2 bg-gray-600 hover:bg-gray-500 rounded-lg text-gray-200 font-semibold transition border border-gray-400">
            {{confirmModal.cancelText}}
          </button>
          <button 
            ng-click="handleConfirm()"
            class="px-4 py-2 bg-red-600 hover:bg-red-700 rounded-lg text-white font-semibold transition">
            {{confirmModal.confirmText}}
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
