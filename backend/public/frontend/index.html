  <!-- AUTOMATIC cache busting for all local assets - SERVER MANAGES VERSIONS -->
  <script>
    // Automatic cache busting implementation - works with server-generated versions
    (function() {
      // Create a super-unique version for this session
      var SESSION_VERSION = 'v' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
      window.APP_VERSION = SESSION_VERSION;
      console.log('🚀 Auto cache-busting initialized with session version:', SESSION_VERSION);
      
      // Function to enhance already-versioned resources with additional cache busting
      function enhanceResourceCacheBusting(element, attribute) {
        var src = element.getAttribute(attribute);
        if (src && !src.includes('http') && !src.includes('cdn') && src.includes('?v=')) {
          // Resource already has server-generated version, enhance it with session data
          var enhancedSrc = src + '&session=' + SESSION_VERSION;
          element.setAttribute(attribute, enhancedSrc);
          console.log('✅ Enhanced cache-busting for:', src.split('?')[0], '->', enhancedSrc.split('?')[0] + '?...');
        }
      }
      
      // Enhance all existing scripts and styles with additional cache busting
      var allScripts = document.querySelectorAll('script[src]');
      allScripts.forEach(function(script) {
        enhanceResourceCacheBusting(script, 'src');
      });
      
      var allStyles = document.querySelectorAll('link[href*=".css"]');
      allStyles.forEach(function(link) {
        enhanceResourceCacheBusting(link, 'href');
      });
      
      // Monitor for any dynamically added resources
      var observer = new MutationObserver(function(mutations) {
        mutations.forEach(function(mutation) {
          mutation.addedNodes.forEach(function(node) {
            if (node.tagName === 'SCRIPT' && node.src) {
              enhanceResourceCacheBusting(node, 'src');
            } else if (node.tagName === 'LINK' && node.href && node.href.includes('.css')) {
              enhanceResourceCacheBusting(node, 'href');
            }
          });
        });
      });
      
      observer.observe(document.head, { childList: true, subtree: true });
      observer.observe(document.body, { childList: true, subtree: true });
      
      console.log('🔄 Automatic cache-busting system active - server manages versions, client enhances');
    })();
    
    // Enhanced mobile cache clearing
    if (typeof window !== 'undefined' && window.navigator) {
      var timestamp = Date.now();
      sessionStorage.setItem('app_version', timestamp);
      
      // Clear all possible caches
      if ('caches' in window) {
        caches.keys().then(function(names) {
          return Promise.all(
            names.map(function(name) {
              console.log('Clearing cache:', name);
              return caches.delete(name);
            })
          );
        });
      }
      
      // Update service worker
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          registrations.forEach(function(registration) {
            registration.update();
            // Force service worker to skip waiting
            if (registration.waiting) {
              registration.waiting.postMessage({type: 'SKIP_WAITING'});
            }
          });
        });
      }
      
      // Set aggressive caching headers
      if (window.fetch) {
        var originalFetch = window.fetch;
        window.fetch = function() {
          var args = Array.prototype.slice.call(arguments);
          if (args[1]) {
            args[1].cache = 'no-cache';
            args[1].headers = args[1].headers || {};
            args[1].headers['Cache-Control'] = 'no-cache, no-store, must-revalidate';
            args[1].headers['Pragma'] = 'no-cache';
          } else {
            args[1] = {
              cache: 'no-cache',
              headers: {
                'Cache-Control': 'no-cache, no-store, must-revalidate',
                'Pragma': 'no-cache'
              }
            };
          }
          return originalFetch.apply(window, args);
        };
      }
    }
  </script>
