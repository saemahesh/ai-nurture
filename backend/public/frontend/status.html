<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="dark-theme.css">
</head>
<body class="status-page">
<div class="flex dark-theme min-h-screen">
  <div ng-include="'sidebar.html'" ng-controller="SidebarController"></div>
  <div class="flex-1 flex flex-col overflow-hidden">
    <header class="dark-theme-header dark-theme-header-bg z-10 py-4 px-6" style="position: relative; z-index: 5 !important;">
      <div class="flex justify-between items-center">
        <h2 class="text-xl font-semibold text-white" style="padding-left:50px;">Status</h2>
        <button class="px-4 py-2 bg-blue-900 text-white rounded-lg font-semibold shadow hover:bg-blue-800 transition" ng-click="showCreateStatusModal()">
          <i class="fas fa-plus mr-2"></i> Create
        </button>
      </div>
    </header>
    <main class="flex-1 p-6" style="background: linear-gradient(115deg, #0c1624 0%, #051733 30%, #091426 70%, #0f172a 100%), radial-gradient(circle at 60% 40%, #3b82f6 0%, transparent 80%) !important;">
      <div class="max-w-2xl mx-auto">
        <!-- Create Status Modal -->
        <div ng-if="createStatusModalVisible" class="fixed inset-0 z-50 flex items-center justify-center min-h-screen overflow-y-auto" style="background: rgba(15,23,42,0.7); z-index: 99999 !important; padding-top: 60px !important;" ng-click="hideCreateStatusModal()">
          <div class="bg-gradient-to-br from-slate-700 via-gray-800 to-slate-900 rounded-xl shadow-2xl p-4 sm:p-6 w-full max-w-lg mx-auto border-2 border-slate-600 relative" style="background: linear-gradient(115deg, #0c1624 0%, #051733 30%, #091426 70%, #0f172a 100%), radial-gradient(circle at 60% 40%, #3b82f6 0%, transparent 80%) !important; min-height: 0; margin-top: 4rem; margin-bottom: 2rem; padding-top: 1rem;" ng-click="$event.stopPropagation()">
            <!-- Close X button at top -->
            <button type="button" class="absolute top-3 right-3 text-gray-400 hover:text-white text-xl font-bold close-x-button" style="border: none !important; outline: none !important; background: transparent !important;" ng-click="hideCreateStatusModal()">✕</button>
            <form name="statusForm" ng-submit="scheduleStatus()" novalidate autocomplete="off" class="status-form" style="margin-top: 10px !important; padding-top: 10px !important;">
              <div class="mb-4">
                <label class="block text-teal-300 font-medium mb-1">Select Media <span class="text-red-400">*</span></label>
                <select ng-model="status.mediaUrl" class="dark-theme-input w-full px-3 py-2 rounded-lg" required>
                  <option value="" disabled selected>Select from Media Library</option>
                  <option ng-repeat="m in mediaLibrary" value="{{m.url}}">{{m.name}} ({{m.type}})</option>
                </select>
                <div class="mt-2">
                  <img ng-if="status.mediaUrl && getMediaType(status.mediaUrl)==='image'" ng-src="{{status.mediaUrl}}" class="h-24 rounded shadow" />
                  <video ng-if="status.mediaUrl && getMediaType(status.mediaUrl)==='video'" ng-src="{{status.mediaUrl}}" class="h-24 rounded shadow" controls></video>
                </div>
              </div>
              <div class="mb-4">
                <label class="block text-teal-300 font-medium mb-1">Caption</label>
                <textarea ng-model="status.caption" class="dark-theme-input w-full px-3 py-2 rounded-lg" maxlength="220" placeholder="Enter status caption (max 220 chars)"></textarea>
              </div>
              <div class="mb-4 flex items-center space-x-4">
                <div>
                  <label class="block text-teal-300 font-medium mb-1">Text Color</label>
                  <input type="color" ng-model="status.textColor" class="w-10 h-10 p-0 border-0 rounded">
                </div>
                <div>
                  <label class="block text-teal-300 font-medium mb-1">Background Color</label>
                  <input type="color" ng-model="status.bgColor" class="w-10 h-10 p-0 border-0 rounded">
                </div>
              </div>
              <div class="mb-4">
                <label class="block text-teal-300 font-medium mb-1">Schedule Time <span class="text-red-400">*</span></label>
                <div class="flex items-center space-x-2">
                  <select ng-model="status.hour" class="dark-theme-input w-full px-3 py-2 rounded-lg" required>
                    <option ng-repeat="h in hours" value="{{h}}">{{h}}</option>
                  </select>
                  <select ng-model="status.minute" class="dark-theme-input w-full px-3 py-2 rounded-lg" required>
                    <option ng-repeat="m in minutes" value="{{m}}">{{m}}</option>
                  </select>
                  <select ng-model="status.ampm" class="dark-theme-input w-full px-3 py-2 rounded-lg" required>
                    <option value="AM">AM</option>
                    <option value="PM">PM</option>
                  </select>
                </div>
              </div>
              <div class="mb-4">
                <label class="block text-teal-300 font-medium mb-1">Repeat</label>
                <select ng-model="status.repeat" class="dark-theme-input w-full px-3 py-2 rounded-lg">
                  <option value="once">Once</option>
                  <option value="daily">Daily</option>
                  <option value="custom">Specific Days</option>
                </select>
              </div>
              <div class="mb-4" ng-if="status.repeat === 'custom'">
                <label class="block text-teal-300 font-medium mb-1">Select Days</label>
                <div class="flex flex-wrap gap-2">
                  <label ng-repeat="day in days" class="flex items-center text-gray-300">
                    <input type="checkbox" ng-model="status.days[day]" class="mr-1 text-teal-500"> {{day}}
                  </label>
                </div>
              </div>
                            <button type="submit" class="px-4 py-2 bg-blue-900 hover:bg-blue-800 rounded-lg text-white font-semibold transition">Create Status</button>
              <span ng-if="saveSuccess" class="ml-3 text-teal-400 font-medium">Scheduled!</span>
              <span ng-if="saveError" class="ml-3 text-red-400 font-medium">{{saveError}}</span>
              <button type="button" class="ml-4 px-4 py-2 bg-gray-600 hover:bg-gray-500 rounded-lg text-gray-200 font-semibold transition border border-gray-400" ng-click="hideCreateStatusModal()">Cancel</button>
            </form>
          </div>
        </div>
        <!-- Scheduled Statuses List -->
        <div class="bg-gradient-to-br from-gray-800 to-gray-900 rounded-xl shadow-lg p-6 mt-6 border border-gray-700">
          <h3 class="text-lg font-semibold mb-4 text-white">Scheduled Statuses</h3>
          <div ng-if="scheduledStatuses.length === 0" class="text-gray-400 text-center py-8">
            <i class="fas fa-calendar-alt text-3xl text-gray-500 mb-3"></i>
            <p>No statuses scheduled.</p>
          </div>
          <div ng-repeat="s in scheduledStatuses" class="mb-4 p-4 bg-gray-700 rounded-lg border border-gray-600 flex items-center justify-between hover:bg-gray-650 transition-all">
            <div class="flex items-center">
              <img ng-if="getMediaType(s.media)==='image'" ng-src="{{s.media}}" class="h-12 w-12 rounded shadow mr-4" />
              <video ng-if="getMediaType(s.media)==='video'" ng-src="{{s.media}}" class="h-12 w-12 rounded shadow mr-4" controls></video>
              <div>
                <div class="font-medium text-white">{{s.caption}}</div>
                <div class="text-xs text-gray-400">Time: {{s.timeDisplay}} | Repeat: {{s.repeat}} <span ng-if="s.repeat==='custom'">({{getSelectedDays(s.days)}})</span></div>
              </div>
            </div>
            <div>
              <button class="text-blue-400 hover:text-blue-300 mr-2 px-2 py-1 rounded hover:bg-gray-700 transition" ng-click="editStatus(s)">Edit</button>
              <button class="text-blue-400 hover:text-blue-300 px-2 py-1 rounded hover:bg-gray-700 transition" ng-click="deleteStatus(s.id)">Delete</button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
